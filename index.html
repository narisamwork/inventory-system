<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการสต็อกสินค้า</title>
    <!-- Google Font: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h2.title {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
        }

        .card h3 {
            font-size: 1.1rem;
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: 500;
            border-left: 4px solid #3498db;
            padding-left: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.1s ease;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* ตารางสินค้าคงเหลือ */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #f8f9fa;
            color: #7f8c8d;
            font-weight: 500;
            padding: 12px 15px;
            font-size: 0.9rem;
            border-bottom: 2px solid #edf2f7;
        }

        td {
            padding: 14px 15px;
            border-bottom: 1px solid #edf2f7;
            font-size: 0.95rem;
            color: #2d3748;
        }

        tr:hover td {
            background-color: #fafbfc;
        }

        .text-center {
            text-align: center;
        }

        .text-right {
            text-align: right;
        }

        .btn-danger {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background-color 0.2s;
        }

        .btn-danger:hover {
            background-color: #c0392b;
        }

        .empty-row {
            text-align: center;
            color: #a0aec0;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 class="title">📦 ระบบจัดการสต็อกสินค้า</h2>

        <!-- ฟอร์มเพิ่มข้อมูล -->
        <div class="card">
            <h3>เพิ่ม / แก้ไขข้อมูลสินค้า</h3>
            <form id="productForm">
                <div class="form-group">
                    <input type="text" id="productName" class="form-control" placeholder="ชื่อสินค้า (เช่น เสื้อโปโล)" required>
                </div>
                <div class="form-group">
                    <input type="number" id="productQty" class="form-control" placeholder="จำนวนในสต็อก" min="0" required>
                </div>
                <button type="submit" class="btn-primary">บันทึกสินค้า</button>
            </form>
        </div>

        <!-- รายการสินค้าคงเหลือ -->
        <div class="card">
            <h3>รายการสินค้าคงเหลือ</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ชื่อสินค้า</th>
                            <th class="text-center" style="width: 120px;">จำนวน</th>
                            <th class="text-right" style="width: 80px;">ลบ</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody">
                        <!-- ข้อมูลจะถูกเรนเดอร์อัตโนมัติด้วย JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ดึงข้อมูลจาก LocalStorage หรือใช้ค่าเริ่มต้นถ้ายังไม่มี
        let products = JSON.parse(localStorage.getItem('stock_products')) || [
            { id: 1, name: 'พัดลมฟาร์ม ขนาด 16 นิ้ว', qty: 30 },
            { id: 2, name: 'พัดลมฟาร์ม ขนาด 20 นิ้ว', qty: 50 },
            { id: 3, name: 'พัดลมฟาร์ม ขนาด 24 นิ้ว', qty: 16 }
        ];

        const productForm = document.getElementById('productForm');
        const productNameInput = document.getElementById('productName');
        const productQtyInput = document.getElementById('productQty');
        const productTableBody = document.getElementById('productTableBody');

        // ฟังก์ชันสำหรับแสดงผลข้อมูลลงในตาราง
        function renderTable() {
            productTableBody.innerHTML = '';

            if (products.length === 0) {
                productTableBody.innerHTML = `<tr><td colspan="3" class="empty-row">ไม่มีรายการสินค้าในสต็อก</td></tr>`;
                return;
            }

            products.forEach((product, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${escapeHtml(product.name)}</td>
                    <td class="text-center">${product.qty}</td>
                    <td class="text-right">
                        <button class="btn-danger" onclick="deleteProduct(${index})">✕</button>
                    </td>
                `;
                productTableBody.appendChild(tr);
            });
        }

        // ฟังก์ชันเพิ่มสินค้า
        productForm.addEventListener('submit', function(e) {
            e.preventDefault(); // ป้องกันการรีเฟรชหน้าเว็บแบบปกติ

            const name = productNameInput.value.trim();
            const qty = parseInt(productQtyInput.value);

            if (name && !isNaN(qty)) {
                // เพิ่มข้อมูลใหม่เข้าไปในอาร์เรย์
                products.push({ id: Date.now(), name: name, qty: qty });
                
                // บันทึกลง LocalStorage
                saveAndRefresh();

                // ล้างค่าในฟอร์ม
                productNameInput.value = '';
                productQtyInput.value = '';
            }
        });

        // ฟังก์ชันลบสินค้า
        window.deleteProduct = function(index) {
            if (confirm('คุณต้องการลบสินค้านี้ใช่หรือไม่?')) {
                products.splice(index, 1); // ตัดข้อมูลออก 1 ตัวตาม index
                saveAndRefresh();
            }
        }

        // ฟังก์ชันบันทึกข้อมูลและอัปเดตตาราง
        function saveAndRefresh() {
            localStorage.setItem('stock_products', JSON.stringify(products));
            renderTable();
        }

        // ป้องกัน XSS เบื้องต้น
        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // โหลดแสดงผลครั้งแรกเมื่อเปิดหน้าเว็บ
        renderTable();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการสต็อกสินค้า</title>
    <!-- Google Font: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h2.title {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
        }

        .card h3 {
            font-size: 1.1rem;
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: 500;
            border-left: 4px solid #3498db;
            padding-left: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.1s ease;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* ตารางสินค้าคงเหลือ */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #f8f9fa;
            color: #7f8c8d;
            font-weight: 500;
            padding: 12px 15px;
            font-size: 0.9rem;
            border-bottom: 2px solid #edf2f7;
        }

        td {
            padding: 14px 15px;
            border-bottom: 1px solid #edf2f7;
            font-size: 0.95rem;
            color: #2d3748;
        }

        tr:hover td {
            background-color: #fafbfc;
        }

        .text-center {
            text-align: center;
        }

        .text-right {
            text-align: right;
        }

        .btn-danger {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background-color 0.2s;
        }

        .btn-danger:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 class="title">📦 ระบบจัดการสต็อกสินค้า</h2>

        <!-- ฟอร์มเพิ่ม/แก้ไขข้อมูล -->
        <div class="card">
            <h3>เพิ่ม / แก้ไขข้อมูลสินค้า</h3>
            <div class="form-group">
                <input type="text" class="form-control" placeholder="ชื่อสินค้า (เช่น เสื้อโปโล)">
            </div>
            <div class="form-group">
                <input type="number" class="form-control" placeholder="จำนวนในสต็อก">
            </div>
            <button class="btn-primary">บันทึกสินค้า</button>
        </div>

        <!-- รายการสินค้าคงเหลือ -->
        <div class="card">
            <h3>รายการสินค้าคงเหลือ</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ชื่อสินค้า</th>
                            <th class="text-center">จำนวน</th>
                            <th class="text-right">ลบ</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>พัดลมฟาร์ม ขนาด 16 นิ้ว</td>
                            <td class="text-center">30</td>
                            <td class="text-right"><button class="btn-danger">✕</button></td>
                        </tr>
                        <tr>
                            <td>พัดลมฟาร์ม ขนาด 20 นิ้ว</td>
                            <td class="text-center">50</td>
                            <td class="text-right"><button class="btn-danger">✕</button></td>
                        </tr>
                        <tr>
                            <td>พัดลมฟาร์ม ขนาด 24 นิ้ว</td>
                            <td class="text-center">16</td>
                            <td class="text-right"><button class="btn-danger">✕</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
